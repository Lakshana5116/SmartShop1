apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartshop-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartshop
  template:
    metadata:
      labels:
        app: smartshop
    spec:
      containers:
        - name: smartshop-container
          image: lakshana5116/smartshop:2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8081

---
apiVersion: v1
kind: Service
metadata:
  name: smartshop-service
spec:
  type: NodePort
  selector:
    app: smartshop
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30007